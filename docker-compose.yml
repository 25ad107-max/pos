services:
  postgres:
    image: postgres:16-alpine
    container_name: maruthi-transport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maruthi_transport
      POSTGRES_USER: maruthi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maruthi_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - maruthi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maruthi -d maruthi_transport"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maruthi_postgres_data:
